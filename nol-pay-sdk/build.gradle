plugins {
    alias libs.plugins.android.library
    alias libs.plugins.kotlin.android
    alias libs.plugins.ktlint
    alias libs.plugins.maven.publish
}

android {
    compileSdkVersion 34
    namespace 'com.snowballtech.transit.rta'

    defaultConfig {
        minSdkVersion 21
        targetSdk 34
    }

    buildTypes {
        release {
            minifyEnabled true
            consumerProguardFiles 'consumer-rules.pro'
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro', 'consumer-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_17.toString()
    }

    sourceSets {
        main.java.srcDirs += 'src/main/java'
    }

    buildTypes.each {
        it.buildConfigField 'String', 'SDK_VERSION_STRING', "\"3.1.11\""
        it.buildConfigField 'String', 'SDK_WRAPPER_VERSION_STRING', "\"$VERSION_NAME\""
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])

    implementation libs.security.crypto
    implementation libs.spongycastle.core
    implementation libs.spongycastle.prov
    implementation libs.spongycastle.bcpkix
    implementation libs.gson
}

apply from: "$rootDir/config/publish.gradle"
