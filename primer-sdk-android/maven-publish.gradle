apply plugin: 'maven-publish'

task sourceJar(type: Jar) {
    from android.sourceSets.main.java.srcDirs
    classifier "source"
}

version = libraryVersion
group = publishedGroupId

android.libraryVariants.all { variant ->
    if (variant.buildType.name == "release") {
        variant.outputs.all { output ->
            publishing.publications.create("_$variant.name", MavenPublication) {
                artifact sourceJar // The sources artifact from earlier
                artifactId 'sdk'

                // Variant dependent artifact, e.g. release, debug
                artifact source: output.outputFile, classifier: output.name

                // Go through all the dependencies for each variant and add them to the POM file as dependencies
                pom.withXml {
                    def dependencies = asNode().appendNode('dependencies')
                    // Filter out anything that's not an external dependency
                    configurations.getByName(variant.name + "CompileClasspath").allDependencies
                            .findAll { it instanceof ExternalDependency }
                            .each {
                                def dependency = dependencies.appendNode('dependency')

                                dependency.appendNode('groupId', it.group)
                                dependency.appendNode('artifactId', it.name)
                                dependency.appendNode('version', it.version)
                            }
                }
            }
        }
    }
}

// Ensure that the publish task depends on assembly
tasks.all { task ->
    if (task instanceof AbstractPublishToMaven) {
        task.dependsOn assembleRelease
    }
}

publishing {
    repositories {
        maven {
            def ENV = System.getenv()
            url ENV['PRIMER_S3_MAVEN_REPO']
            credentials(AwsCredentials) {
                accessKey = ENV['PRIMER_S3_MAVEN_REPO_ACCESS_KEY']
                secretKey = ENV['PRIMER_S3_MAVEN_REPO_SECRET_KEY']
            }
        }
    }
}
