sonarqube {
    properties {
        property 'sonar.projectKey', 'primer-io_primer-sdk-android'
        property 'sonar.organization', 'primerio'
        property 'sonar.host.url', 'https://sonarcloud.io'
        property 'sonar.java.coveragePlugin', 'kover'
        property 'sonar.language', 'kotlin'
        property 'sonar.sources', 'src/main/'
        property 'sonar.tests', 'src/test/'
        property 'sonar.exclusions', '**/example/**/*,'
        property 'sonar.coverage.exclusions', '**/example/**/*,'
    }
}

subprojects { subproject ->
    afterEvaluate {
        def androidLibraryPluginName = 'com.android.library'
        if (subproject.plugins.hasPlugin(androidLibraryPluginName)) {
            apply plugin: 'org.sonarqube'

            def sonarExclusions = [
                    '**/di/**/*',
                    '**/analytics/**/*',
                    '**/build/**',
                    '**/generated/**',
                    '**/implementation/configuration/domain/*',
                    '**/implementation/tokenization/data/repository/*',
                    '**/data/datasource/*',
                    '**/implementation/tokenization/domain/*',
                    '**/*.json',
                    '**/*Test*.*'
            ]

            def coverageExclusions = [
                    '**/di/**/*',
                    '**/analytics/**/*',
                    '**/widgets/**/*',
                    '**/views/**/*',
                    '**/io/primer/android/ui/**/*',
                    '**/implementation/configuration/domain/*',
                    '**/implementation/tokenization/data/repository/*',
                    '**/data/datasource/*',
                    '**/implementation/tokenization/domain/*',
                    '**/*Fragment.*',
                    '**/*Fragment$*.*',
                    '**/*Activity.*',
                    '**/*Activity$*.*',
                    '**/BuildConfig.*',
                    '**/*Module.*',
                    '**/*ComposerProviderFactory.*',
                    '**/*ViewModelFactory.*',
                    '**/*ViewHolder$*.*',
                    '**/*ViewHolder.*',
                    '**/*Adapter$*.*',
                    '**/*Adapter.*',
                    '**/*Button*',
                    '**/*Widget*.*',
                    '**/*WebViewClient*',
                    '**/*Layout*',
                    '**/*Behavior*',
                    '**/*Dialog*',
                    '**/*Dialog$*',
                    '**/databinding/**',
                    '**/binding/**',
                    '**/*Test*.*',
                    "**/res/**/*.*",
                    "**/assets/**/*.*",
                    '**/R.class',
                    '**/R$*.class',
                    '**/BuildConfig.*',
                    '**/*Manifest.*',
                    'android/**/*.*',
                    'androidx/**/*.*',
                    '**/io/primer/android/PrimerCheckout.kt',
                    // Theme & Design System
                    '**/io/primer/android/PrimerTheme.kt',
                    '**/io/primer/android/internal/tokens/**/*',
                    // Public API - @Composable Components
                    '**/io/primer/android/api/components/**/*',
                    '**/io/primer/android/api/checkout/**/*',
                    // Internal Presentation - @Composable UI
                    '**/io/primer/android/internal/presentation/screens/**/*',
                    '**/io/primer/android/internal/presentation/components/**/*',
                    '**/io/primer/android/internal/presentation/checkout/**/*',
                    '**/io/primer/android/internal/presentation/preview/**/*',
                    '**/io/primer/android/internal/presentation/utils/VaultItemProperties.kt',
                    // Scope APIs
                    '**/io/primer/android/scope/*Scope.kt',
                    '**/io/primer/android/scope/providers/**/*',
                    // Components DI & Domain
                    '**/io/primer/android/internal/di/ComponentsContainer.kt',
                    '**/io/primer/android/internal/domain/repositories/**/*',
                    // KlarnaRepositoryImpl: Depends on KlarnaComponent (ViewModel subclass) which cannot be
                    // reliably mocked with MockK due to coroutine scope ClassCastException.
                    '**/io/primer/android/internal/data/repositories/KlarnaRepositoryImpl.kt',
            ]

            sonarqube {
                properties {
                    property 'sonar.sources', 'src/'
                    property 'sonar.tests', 'src/'
                    property 'sonar.coverage.jacoco.xmlReportPaths', "${project.buildDir}/reports/kover/reportRelease.xml"
                    property 'sonar.exclusions', sonarExclusions.join(', ')
                    property 'sonar.coverage.exclusions', coverageExclusions.join(', ')
                    property 'sonar.test.inclusions', 'src/test/**/*'
                }
            }
        }
    }
}
