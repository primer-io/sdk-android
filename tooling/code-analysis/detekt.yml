build:
  maxIssues: 10
style:
  MaxLineLength:
    excludes: [ '**/test/**', '**/*.Test.kt', '**/*.Spec.kt' ]
    excludeCommentStatements: true
    maxLineLength: 120
  MagicNumber:
    ignorePropertyDeclaration: true
    ignoreCompanionObjectPropertyDeclaration: true
  UnusedPrivateMember:
    ignoreAnnotated: [ 'Preview' ]
complexity:
  LongMethod:
    excludes: [ '**/test/**', '**/*.Test.kt', '**/*.Spec.kt' ]
  LargeClass:
    excludes: [ '**/test/**', '**/*.Test.kt', '**/*.Spec.kt' ]
  LongParameterList:
    ignoreDefaultParameters: true
    ignoreAnnotated: [ 'Composable' ]
  TooManyFunctions:
    ignoreAnnotatedFunctions: [ 'Preview' ]
naming:
  active: true
  FunctionNaming:
    ignoreAnnotated: [ 'Composable' ]
  TopLevelPropertyNaming:
    constantPattern: '[A-Z][A-Za-z0-9_]*'
formatting:
  android: true
  autoCorrect: true
  TrailingCommaOnCallSite:
    active: true
    autoCorrect: true
    useTrailingCommaOnCallSite: true
  TrailingCommaOnDeclarationSite:
    active: true
    autoCorrect: true
    useTrailingCommaOnDeclarationSite: true
  ArgumentListWrapping:
    active: true
    autoCorrect: true
    indentSize: 4
    maxLineLength: 120
  ContextReceiverMapping:
    active: true
    autoCorrect: true
    maxLineLength: 120
    indentSize: 4
  FunctionReturnTypeSpacing:
    active: true
    autoCorrect: true
    maxLineLength: 120
  FunctionSignature:
    active: false
    autoCorrect: true
  MaximumLineLength:
    active: true
    maxLineLength: 120
    ignoreBackTickedIdentifier: true
  ParameterListSpacing:
    active: true
    autoCorrect: true
    maxLineLength: 120
  ParameterListWrapping:
    active: true
    autoCorrect: true
    maxLineLength: 120
    indentSize: 4
  ParameterWrapping:
    active: true
    autoCorrect: true
    indentSize: 4
    maxLineLength: 120
  PropertyWrapping:
    active: true
    autoCorrect: true
    indentSize: 4
    maxLineLength: 120
  Wrapping:
    active: true
    autoCorrect: true
    indentSize: 4
    maxLineLength: 120
