apply plugin: "com.android.library"
apply plugin: "kotlin-android"

android {
    compileSdk 36
    buildToolsVersion "36.0.0"

    defaultConfig {
        testInstrumentationRunnerArguments runnerBuilder: 'de.mannodermaus.junit5.AndroidJUnit5Builder'
        minSdkVersion 23
        targetSdkVersion 36

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        consumerProguardFiles "consumer-rules.pro"
    }

    buildTypes.forEach {
        it.buildConfigField("String", "SDK_VERSION_STRING", "\"${project.findProperty("VERSION_NAME")}\"")
        it.buildConfigField("String", "SDK_GROUP_ID", "\"${project.findProperty("GROUP")}\"")
    }

    buildFeatures {
        viewBinding = true
        buildConfig = true
    }

    compileOptions {
        sourceCompatibility = projectJvmTarget
        targetCompatibility = projectJvmTarget
    }

    kotlinOptions {
        jvmTarget = projectJvmTarget.toString()
    }

    testOptions {
        execution = 'ANDROIDX_TEST_ORCHESTRATOR'

        unitTests.all {
            useJUnitPlatform()
            // Without a cap a test JVM may take a quarter of the machine's memory, and several run at once.
            maxHeapSize = "1024m"
            systemProperty("junit.jupiter.execution.parallel.enabled", "false")
            // A hung test fails after 5 minutes with its stack trace instead of stalling the CI job.
            systemProperty("junit.jupiter.execution.timeout.default", "5m")
        }
        unitTests.returnDefaultValues = true
    }
}

dependencies {
    // Every published module depends on the BOM as a platform (Gradle "version alignment"): consumer builds
    // that pin any io.primer:* artifact, e.g. a hand-pinned wrapper, resolve all io.primer:* artifacts to the
    // highest io.primer version in the graph instead of drifting from the main SDK. Do not remove.
    api platform(project(':bom'))

    testRuntimeOnly(libs.junit.jupiter.api)
    testImplementation(libs.junit.jupiter.engine)
    testImplementation(libs.junit.jupiter.params)
    testRuntimeOnly(libs.junit.platform.launcher)

    testImplementation(libs.mockk) {
        exclude group: "org.slf4j", module: "slf4j-log4j12"
    }

    testImplementation libs.arch.core

    testImplementation(libs.kotlin.test.junit)
    testImplementation(libs.kotlin.coroutines.test)
    testImplementation(libs.livedata.testing)
    testImplementation(libs.json)

    androidTestImplementation(libs.mockk.android)
    testImplementation(testFixtures(project(":arch-core")))
}
